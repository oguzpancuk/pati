# CI runs the SAME battery agents run locally: .claude/hooks/verify.sh.
# One source of truth for "green" — if this file and verify.sh disagree,
# verify.sh wins and this file is wrong.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # verify.sh does not need the database, but the migrate step below does:
      # it is the only place the schema SQL is actually executed before deploy.
      postgres:
        image: imresamu/postgis:16-3.4
        env: { POSTGRES_USER: stray, POSTGRES_PASSWORD: stray, POSTGRES_DB: stray }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stray" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stray:stray@localhost:5432/stray
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
            web/package-lock.json
            admin/package-lock.json
      - run: for d in backend mobile web admin; do (cd $d && npm ci); done
      - run: bash .claude/hooks/verify.sh full
      - run: cd backend && node scripts/migrate.js

  docker:
    # The deploy artifact: a Dockerfile that stops building is a blocked release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pati-app:ci .

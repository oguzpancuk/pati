# Fly.io yapılandırması — tek makine, kalıcı fotoğraf diski, PostGIS'li Fly Postgres.
# İlk kurulum adımları docs/YAYIN.md içinde.
app = "pati-app"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Şema tek migrasyon dosyası ve IF NOT EXISTS'li: her deploy'da güvenle koşar.
  release_command = "node scripts/migrate.js"

[env]
  PORT = "3000"
  UPLOADS_DIR = "/data/uploads"
  WEB_DIST_DIR = "/app/web-dist"
  ADMIN_DIST_DIR = "/app/admin-dist"
  # Bu ana bilgisayar adından gelen istekler yönetim panelini alır (admin/dist).
  ADMIN_HOST = "admin.pati-app.com"
  # Rehber (demo) bölgelerinin haritasını canlı tutar: sunucu saatte bir,
  # rehber hesaplar adına birkaç taze mama/su ekler. Rehber verisi kaldırılınca
  # (seed-rehber --temizle) bu satır da silinebilir; verisiz zararsızdır.
  DEMO_REHBER_TAZELE = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "uploads"
  destination = "/data/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

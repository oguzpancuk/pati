# Fly.io configuration — one machine, a persistent photo volume, Fly Postgres
# with PostGIS. First-time setup steps live in docs/DEPLOYMENT.md.
app = "pati-app"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Numbered, idempotent migration files applied in order: safe on every deploy.
  release_command = "node scripts/migrate.js"

[env]
  PORT = "3000"
  UPLOADS_DIR = "/data/uploads"
  WEB_DIST_DIR = "/app/web-dist"
  ADMIN_DIST_DIR = "/app/admin-dist"
  # Requests arriving on this hostname get the admin panel (admin/dist).
  ADMIN_HOST = "admin.pati-app.com"
  # Keeps the guide (demo) areas alive: the server adds a few fresh
  # food/water actions on behalf of guide accounts every hour. Once the guide
  # data is removed (seed-guides --remove) this line can go too; without the
  # data it is harmless.
  DEMO_GUIDE_REFRESH = "1"
  # Browser calls only from our own hosts; the native app sends no Origin.
  CORS_ORIGINS = "https://pati-app.com,https://www.pati-app.com,https://admin.pati-app.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "uploads"
  destination = "/data/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Chrome and Firefox on Android shrink the page for
         the keyboard instead of panning it (Safari ignores the key; the
         conversation page follows its visual viewport, keyboardViewport.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Nunito comes from our own files (src/nunito.css): the PWA must open
         with the brand typeface offline too, with no third-party request. -->
    <title>pati</title>
    <!-- What a link preview (a CV, a message) shows before any script runs;
         the page itself is AboutPage. -->
    <meta
      name="description"
      content="pati is a free app for the people who feed and care for street cats and dogs in Türkiye: a shared map of food and water, animal profiles and health records."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pati" />
    <meta property="og:title" content="pati: street cats and dogs, looked after together" />
    <meta
      property="og:description"
      content="A shared map of food and water, animal profiles and health records for the people who care for street animals in Türkiye."
    />
    <meta property="og:url" content="https://pati-app.com/" />
    <!-- The square app icon: "summary" is the card shape that fits it. -->
    <meta property="og:image" content="https://pati-app.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
